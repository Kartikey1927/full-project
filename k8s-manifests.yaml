apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservice-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: microservice-app
  template:
    metadata:
      labels:
        app: microservice-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: app
        image: python:3.10-slim
        command: ["python", "-c"]
        args:
        - |
          import urllib.request
          urllib.request.urlretrieve("https://raw.githubusercontent.com/Kartikey1927/full-project/main/app.py", "app.py")
          urllib.request.urlretrieve("https://raw.githubusercontent.com/Kartikey1927/full-project/main/requirements.txt", "requirements.txt")
          import subprocess
          subprocess.run(["pip", "install", "-r", "requirements.txt"])
          subprocess.run(["python", "app.py"])
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: microservice-app
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: microservice-app
  ports:
  - port: 5000
    targetPort: 5000
