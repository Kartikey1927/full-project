apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: microservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9898"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: web
        image: stefanprodan/podinfo:6.0.0
        ports:
        - containerPort: 9898
---
apiVersion: v1
kind: Service
metadata:
  name: sample-app-svc
  namespace: microservice
spec:
  ports:
  - port: 80
    targetPort: 9898
  selector:
    app: sample-app
