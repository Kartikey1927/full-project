apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: full-project-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Kartikey1927/full-project.git'
    targetRevision: HEAD
    path: '.'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
