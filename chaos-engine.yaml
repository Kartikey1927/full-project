apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: sample-app-chaos
  namespace: microservice
spec:
  appinfo:
    appns: microservice
    applabel: "app=sample-app"
    appkind: deployment
  chaosServiceAccount: litmus-admin
  engineState: active
  experiments:
    - name: pod-delete
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "30"
            - name: CHAOS_INTERVAL
              value: "10"
            - name: FORCE
              value: "true"
